<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; color: #111827; }
      h1 { margin: 0 0 6px; font-size: 14px; }
      p { margin: 0 0 10px; color: #6b7280; }
      button { width: 100%; margin-bottom: 6px; padding: 7px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
      button:hover { background: #f3f4f6; }
      #message { margin: 6px 0 0; color: #374151; }
    </style>
  </head>
  <body>
    <h1>toolhub 글쓰기 도우미</h1>
    <p>네이버 블로그 글쓰기 화면에서 본문 문장을 드래그하면 소제목·강조·형광펜 버튼이 나타나요.</p>
    <button id="options" type="button">서식 설정</button>
    <button id="diagnose" type="button">진단 정보 복사</button>
    <p id="message"></p>
    <script src="popup.js"></script>
  </body>
</html>
