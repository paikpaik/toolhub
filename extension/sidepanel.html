<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>toolhub 이미지 모음</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>이미지 모음</h1>
      <button type="button" class="link" id="clear" hidden>전체 지우기</button>
    </header>

    <label class="auto" title="이 패널을 열어 둔 동안 Gemini·ChatGPT·AI Studio에서 새로 만든 이미지가 저절로 담겨요">
      <input type="checkbox" id="auto" /> 새로 만든 이미지 자동으로 담기 <small>Gemini · ChatGPT · AI Studio</small>
    </label>

    <div id="drop" class="drop" tabindex="0">
      <b>여기에 붙여넣기(⌘V) · 끌어다 놓기</b>
      <span>또는 이미지에서 오른쪽 클릭 → <b>toolhub 패널에 담기</b></span>
    </div>
    <p id="status" class="status"></p>

    <section id="shelf" class="shelf"></section>
    <p id="empty" class="hint">Gemini·ChatGPT에서 만든 이미지를 담아 두면, 클릭 한 번으로 복사해 에디터에 ⌘V로 붙여넣을 수 있어요.</p>

    <footer>
      <button type="button" class="link" id="options">서식 설정</button>
      <button type="button" class="link" id="diagnose" title="드래그 서식 버튼이 동작하지 않을 때 에디터 구조를 복사해 알려 주세요">진단 정보 복사</button>
    </footer>

    <script src="lib.js"></script>
    <script src="shelf-store.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
